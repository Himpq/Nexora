<!DOCTYPE html>
<!--
  通用场景模板（第一版，强自适应）。
  由 core/html_renderer.py 用 string.Template 注入占位符后，交给 playwright 截图成 1920x1080 PNG。
  设计目标：替代 Pillow 手画的色块 PPT —— 用 CSS flex 自动居中/不溢出，靠留白、渐变、字体、
  阴影把审美下限托住，不依赖 LLM 算坐标。
  占位符（$ 语法；CSS 中无 $，安全）：
    $font_family $bg_css $accent $title $subtitle_block $figure_block $body_block
-->
    
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1920px; height: 1080px; overflow: hidden;
    font-family: $font_family;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .stage {
    position: relative; width: 1920px; height: 1080px;
    background: $bg_css; color: #f8fafc;
    display: flex; flex-direction: column;
    justify-content: center; align-items: stretch;
    padding: 140px 160px;
  }
  /* 底图层：铺满 + 暗化渐变遮罩，保证上层文字始终可读 */
  .figure {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
  }
  .figure::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(8,12,24,.55) 0%, rgba(8,12,24,.78) 100%);
  }
  .content { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 40px; }
  .title {
    font-size: 96px; font-weight: 800; line-height: 1.15; letter-spacing: .5px;
    text-shadow: 0 4px 30px rgba(0,0,0,.45);
    max-width: 1500px;
  }
  /* 标题下方的强调色短线 */
  .title::after {
    content: ""; display: block; width: 160px; height: 10px; border-radius: 999px;
    margin-top: 32px; background: $accent;
    box-shadow: 0 0 28px $accent;
  }
  .subtitle {
    font-size: 44px; font-weight: 400; line-height: 1.4; color: #cbd5e1;
    max-width: 1400px;
  }
  .bullets { display: flex; flex-direction: column; gap: 28px; margin-top: 16px; }
  .bullet {
    display: flex; align-items: flex-start; gap: 28px;
    font-size: 46px; line-height: 1.35; color: #e2e8f0;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.10);
    border-left: 8px solid $accent;
    border-radius: 18px; padding: 28px 36px;
    backdrop-filter: blur(6px);
    box-shadow: 0 10px 40px rgba(0,0,0,.30);
  }
  .bullet .dot {
    flex: none; width: 18px; height: 18px; margin-top: 18px; border-radius: 50%;
    background: $accent; box-shadow: 0 0 18px $accent;
  }
</style>
</head>
<body>
  <div class="stage">
    $figure_block
    <div class="content">
      <div class="title">$title</div>
      $subtitle_block
      $body_block
    </div>
  </div>
</body>
</html>
