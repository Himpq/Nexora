<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexora</title>

    <!-- 第三方 vendor 资产(fonts / katex / fontawesome)仍由 Flask /static 托管 -->
    <link rel="stylesheet" href="/static/vendor/fonts/fonts.css" />
    <!-- 代码高亮双主题:亮色常开,暗色默认禁用,由 theme store 按 data-theme 联动启停 -->
    <link rel="stylesheet" href="/static/vendor/highlightjs/styles/github.min.css" />
    <link rel="stylesheet" href="/static/vendor/highlightjs/styles/github-dark.min.css" id="hljs-theme-dark" disabled />
    <link rel="stylesheet" href="/static/vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css" />
    <!-- Nexora 原版设计 CSS 已收编进 Vue 工程(src/styles/legacy),经 main.ts 统一引入 -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
