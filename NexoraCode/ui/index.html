<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>NexoraCode</title>
    <link rel="stylesheet" href="/nc/vendor/fonts/fonts.css"/>
    <link rel="stylesheet" href="/nc/vendor/highlightjs/styles/github.min.css"/>
    <link rel="stylesheet" href="/nc/vendor/katex/katex.min.css"/>
    <link rel="stylesheet" href="/css/style.css"/>
</head>
<body>
    <!-- 登录视图 -->
    <div id="view-login" class="view hidden">
        <form id="login-form" class="login-card">
            <div class="brand">Nexora<span class="dot"></span></div>
            <div class="brand-sub">本地项目助手</div>
            <input id="login-username" class="field" type="text" placeholder="用户名" autocomplete="username" required/>
            <input id="login-password" class="field" type="password" placeholder="密码" autocomplete="current-password" required/>
            <button type="submit" class="btn primary block">登录</button>
            <div id="login-error" class="error-text"></div>
        </form>
    </div>

    <!-- 主界面 -->
    <div id="view-main" class="view hidden">
        <aside class="sidebar">
            <div class="project-box">
                <div class="project-head">
                    <span class="section-label">项目</span>
                    <button id="btn-select-project" class="icon-btn" title="选择本地项目" type="button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
                        </svg>
                    </button>
                </div>
                <div id="project-panel" class="project-panel">
                    <div class="project-empty">未绑定项目</div>
                </div>
            </div>
            <div class="conv-box">
                <div class="conv-head">
                    <span class="section-label">会话</span>
                    <button id="btn-new-conv" class="icon-btn" title="新建会话" type="button">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </div>
                <div id="conv-list" class="conv-list"></div>
            </div>
        </aside>

        <main class="chat">
            <header class="chat-head">
                <div class="chat-title" id="chat-title">新会话</div>
                <select id="model-select" class="model-select" title="模型"></select>
                <button id="btn-logout" class="btn ghost" type="button">退出</button>
            </header>
            <div id="messages" class="messages"></div>
            <div class="input-box">
                <textarea id="input" class="input" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
                <div class="input-actions">
                    <div id="input-status" class="input-status"></div>
                    <button id="btn-send" class="btn primary" type="button">发送</button>
                    <button id="btn-stop" class="btn danger hidden" type="button">停止</button>
                </div>
            </div>
        </main>
    </div>

    <script src="/nc/vendor/marked/marked.min.js"></script>
    <script src="/nc/vendor/highlightjs/highlight.min.js"></script>
    <script src="/nc/vendor/katex/katex.min.js"></script>
    <script src="/nc/vendor/katex/contrib/auto-render.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/markdown.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
