<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - 协作编辑</title>
    <link rel="stylesheet" href="/static/vendor/fonts/fonts.css">
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="https://uicdn.toast.com/editor/latest/toastui-editor.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/easymde_override.css?v=20260416_13">
    <script src="/static/vendor/marked/marked.min.js"></script>
    <script src="https://uicdn.toast.com/editor/latest/toastui-editor-all.min.js"></script>
    <script src="/static/js/secure_render.js"></script>
    <style>
        :root {
            --bg: #f3f4f6;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --border: #dbe2ea;
            --ok-bg: #dcfce7;
            --ok-ink: #166534;
            --warn-bg: #fef9c3;
            --warn-ink: #854d0e;
            --err-bg: #fee2e2;
            --err-ink: #991b1b;
            --radius: 8px;
        }
        * { box-sizing: border-box; }
        body {
            font-family: var(--nc-font-sans);
            margin: 0;
            min-height: 100vh !important;
            height: auto !important;
            background: var(--bg) !important;
            color: var(--text);
            padding: 16px !important;
            overflow-y: auto !important;
        }
        .public-edit-shell {
            max-width: 1280px;
            margin: 0 auto;
            height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .public-edit-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px 18px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
        }
        .public-edit-title {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            line-height: 1.2;
        }
        .public-edit-meta {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-muted);
        }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 11px;
            border-radius: 999px;
            border: 1px solid transparent;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            user-select: none;
        }
        .status-ok {
            background: var(--ok-bg);
            color: var(--ok-ink);
            border-color: #bbf7d0;
        }
        .status-saving {
            background: var(--warn-bg);
            color: var(--warn-ink);
            border-color: #fde68a;
        }
        .status-error {
            background: var(--err-bg);
            color: var(--err-ink);
            border-color: #fecaca;
        }
        .public-editor-wrap {
            flex: 1;
            min-height: 0;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #knowledgeViewer {
            display: flex;
            flex: 1;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }
        #knowledgeViewer .public-edit-host {
            display: flex;
            flex: 1;
            min-height: 0;
            flex-direction: column;
            overflow: hidden;
        }
        #knowledgeViewer .knowledge-toast-editor {
            flex: 1 1 auto;
            min-height: 0;
            height: 100% !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        /* 隐藏 ToastUI 原生工具栏，因为我们使用上方自定义的 Nexora 风格工具栏 */
        #knowledgeViewer .toastui-editor-toolbar {
            display: none !important;
        }
        /* 修复预览面板中的表格列宽不随内容自适应的问题 */
        #knowledgeViewer .toastui-editor-contents table,
        #knowledgeViewer .editor-preview table {
            table-layout: auto;
            width: fit-content;
            max-width: none;
        }

        /* --- Toast UI 视图模式控制 (完全匹配 EasyMDE 视窗切换状态机) --- */
        #knowledgeViewer .public-edit-host.mode-edit .toastui-editor-md-container .toastui-editor { display: flex !important; width: 100% !important; flex: 1 1 100% !important; }
        #knowledgeViewer .public-edit-host.mode-edit .toastui-editor-md-container .toastui-editor-md-preview { display: none !important; }
        #knowledgeViewer .public-edit-host.mode-edit .toastui-editor-md-container .toastui-editor-md-splitter { display: none !important; }

        #knowledgeViewer .public-edit-host.mode-preview .toastui-editor-md-container .toastui-editor { display: none !important; }
        #knowledgeViewer .public-edit-host.mode-preview .toastui-editor-md-container .toastui-editor-md-preview { display: flex !important; width: 100% !important; flex: 1 1 100% !important; }
        #knowledgeViewer .public-edit-host.mode-preview .toastui-editor-md-container .toastui-editor-md-splitter { display: none !important; }

        #knowledgeViewer .public-edit-host.mode-split .toastui-editor-md-container .toastui-editor { display: flex !important; }
        #knowledgeViewer .public-edit-host.mode-split .toastui-editor-md-container .toastui-editor-md-preview { display: flex !important; }
        #knowledgeViewer .public-edit-host.mode-split .toastui-editor-md-container .toastui-editor-md-splitter { display: flex !important; }

        /* 隐藏或修正选中行/选中域自带的黄色高亮背景 */
        #knowledgeViewer .toastui-editor-md-active-line {
            background-color: transparent !important;
        }
        #knowledgeViewer .toastui-editor-md-container .CodeMirror-selected {
            background-color: #e2e8f0 !important;
        }

        /* 纯文本全屏时的样式覆写 - 匹配原版 EasyMDE 的固定全屏行为 */
        .public-edit-shell.is-fullscreen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
            margin: 0; padding: 0 !important;
            max-width: none !important;
            border-radius: 0;
            z-index: 9999;
            background: var(--bg) !important;
        }
        .public-edit-shell.is-fullscreen .public-edit-head {
            border-radius: 0;
            border-top: none;
            border-left: none;
            border-right: none;
        }
        .public-edit-shell.is-fullscreen .public-editor-wrap {
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
        }

        @media (max-width: 960px) {
            body { padding: 10px; }
            .public-edit-shell { height: calc(100vh - 20px); }
            .public-edit-head { padding: 12px; }
            .public-edit-title { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div id="publicEditShell" class="public-edit-shell">
        <header class="public-edit-head">
            <div>
                <h1 class="public-edit-title">{{ title | e }}</h1>
                <div class="public-edit-meta">由 @{{ username | e }} 开启协作 · `Ctrl+S` 可立即同步</div>
            </div>
            <div id="saveStatus" class="status-badge status-ok">已同步</div>
        </header>
        <section class="public-editor-wrap">
            <div id="knowledgeViewer">
                <div class="public-edit-host knowledge-toast-editor">
                    <textarea id="editorContent" style="display:none;">{{ content | e }}</textarea>
                    
                    <!-- 自定义 Nexora 风格工具栏 -->
                    <div id="customToolbar" class="editor-toolbar" style="border-radius: 0; border: none; border-bottom: 1px solid #ddd; flex-shrink: 0; background: #fff;">
                        <button type="button" tabindex="-1" class="heading" data-cmd="heading" title="标题 (Ctrl-H)"><i class="fa fa-header"></i></button>
                        <button type="button" tabindex="-1" class="bold" data-cmd="bold" title="加粗 (Ctrl-B)"><i class="fa fa-bold"></i></button>
                        <button type="button" tabindex="-1" class="italic" data-cmd="italic" title="斜体 (Ctrl-I)"><i class="fa fa-italic"></i></button>
                        <button type="button" tabindex="-1" class="strikethrough" data-cmd="strike" title="删除线"><i class="fa fa-strikethrough"></i></button>
                        <i class="separator"></i>
                        <button type="button" tabindex="-1" class="quote" data-cmd="quote" title="引用 (Ctrl-')"><i class="fa fa-quote-left"></i></button>
                        <button type="button" tabindex="-1" class="unordered-list" data-cmd="ul" title="无序列表 (Ctrl-L)"><i class="fa fa-list-ul"></i></button>
                        <button type="button" tabindex="-1" class="ordered-list" data-cmd="ol" title="有序列表 (Ctrl-Alt-L)"><i class="fa fa-list-ol"></i></button>
                        <button type="button" tabindex="-1" class="link" data-cmd="link" title="创建链接 (Ctrl-K)"><i class="fa fa-link"></i></button>
                        <button type="button" tabindex="-1" class="image" data-cmd="image" title="插入图片 (Ctrl-Alt-I)"><i class="fa-solid fa-image"></i></button>
                        <button type="button" tabindex="-1" class="table" data-cmd="table" title="插入表格"><i class="fa fa-table"></i></button>
                        <i class="separator"></i>
                        <button type="button" tabindex="-1" class="preview" data-action="preview" title="预览 (Ctrl-P)"><i class="fa fa-eye"></i></button>
                        <button type="button" tabindex="-1" class="side-by-side active" data-action="split" title="分屏 (F9)"><i class="fa fa-columns"></i></button>
                        <button type="button" tabindex="-1" class="fullscreen" data-action="fullscreen" title="全屏 (F11)"><i class="fa fa-arrows-alt"></i></button>
                    </div>
                    <input type="file" id="imageFileInput" accept="image/*" style="display:none;">
                    
                    <div id="editor" style="flex: 1 1 auto; overflow: hidden; min-height: 0; display: flex; flex-direction: column;"></div>
                </div>
            </div>
        </section>
    </div>

    <script>
        const OWNER_USERNAME = {{ username | tojson }};
        const SHARE_ID = {{ share_id | tojson }};
        const INITIAL_CONTENT_REVISION = {{ content_revision | default('') | tojson }};
        const INITIAL_CONTENT_HASH = {{ content_hash | default('') | tojson }};
        const INITIAL_UPDATED_AT = {{ updated_at | default(0) | tojson }};

        function rewriteHtmlFragmentLinksToNewTab(html) {
            const div = document.createElement('div');
            div.innerHTML = String(html || '');
            div.querySelectorAll('a[href]').forEach((a) => {
                a.setAttribute('target', '_blank');
                a.setAttribute('rel', 'noopener noreferrer');
            });
            return div.innerHTML;
        }

        function renderMarkdownSecure(markdown) {
            const raw = String(markdown || '');
            const html = window.NexoraSecureRender
                ? window.NexoraSecureRender.safeMarkdownToHtml(raw)
                : marked.parse(raw);
            return rewriteHtmlFragmentLinksToNewTab(html);
        }

        function setSaveStatus(kind, text) {
            const status = document.getElementById('saveStatus');
            if (!status) return;
            status.className = 'status-badge';
            if (kind === 'saving') status.classList.add('status-saving');
            else if (kind === 'error') status.classList.add('status-error');
            else status.classList.add('status-ok');
            status.textContent = String(text || '');
        }

        function normalizeKnowledgeImageFileName(file, fallback = '') {
            if (file && typeof file.name === 'string' && file.name.trim()) return file.name.trim();
            const mime = String((file && file.type) || '').toLowerCase();
            const ext = mime.includes('png') ? 'png'
                : mime.includes('jpeg') || mime.includes('jpg') ? 'jpg'
                : mime.includes('gif') ? 'gif'
                : mime.includes('webp') ? 'webp'
                : mime.includes('bmp') ? 'bmp'
                : mime.includes('tiff') ? 'tiff'
                : 'png';
            return `${String(fallback || 'image').trim() || 'image'}.${ext}`;
        }

        async function allocatePublicKnowledgeImageSlot(fileName = '') {
            const res = await fetch(`/api/public/knowledge/${encodeURIComponent(OWNER_USERNAME)}/${encodeURIComponent(SHARE_ID)}/image/allocate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ file_name: String(fileName || '').trim() })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data || !data.success) {
                throw new Error(String((data && data.message) || `allocate failed (${res.status})`));
            }
            return data;
        }

        async function uploadPublicKnowledgeImageByFile({ imageId, file, fileName = '' }) {
            const form = new FormData();
            form.append('image_id', String(imageId || '').trim());
            if (fileName) form.append('file_name', String(fileName || '').trim());
            form.append('file', file);
            const res = await fetch(`/api/public/knowledge/${encodeURIComponent(OWNER_USERNAME)}/${encodeURIComponent(SHARE_ID)}/image/upload`, {
                method: 'POST',
                body: form
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok || !data || !data.success) {
                throw new Error(String((data && data.message) || `upload failed (${res.status})`));
            }
            return data;
        }

        let toastEditor = null;
        let saveTimer = null;
        let savingNow = false;
        let queuedSaveAfterCurrent = false;
        let queuedForceSaveAfterCurrent = false;
        let applyingRemoteUpdate = false;
        let pendingRemoteKnowledgePayload = null;
        let lastValue = '';
        let lastSyncedValue = ''; // 上次从服务端拉取的原始内容，用于三方合并
        let lastContentRevision = String(INITIAL_CONTENT_REVISION || '').trim();
        let lastContentHash = String(INITIAL_CONTENT_HASH || '').trim();
        let lastUpdatedAt = Number(INITIAL_UPDATED_AT || 0);
        let currentMode = 'split'; // 'edit', 'preview', 'split'
        let publicKnowledgeSocket = null;
        let publicKnowledgeReconnectTimer = null;
        let publicKnowledgePingTimer = null;
        let publicKnowledgeSocketClosedByServer = false;
        const PUBLIC_KNOWLEDGE_RECONNECT_MS = 1800;
        const PUBLIC_KNOWLEDGE_PING_MS = 25000;
        const PUBLIC_KNOWLEDGE_AUTOSAVE_MS = 800;
        const PUBLIC_KNOWLEDGE_REMOTE_MERGE_SAVE_MS = 650;

        function isPublicKnowledgeSyncDebugEnabled() {
            try {
                return window.__NEXORA_PUBLIC_KNOWLEDGE_SYNC_DEBUG === true
                    || window.localStorage.getItem('nexora.publicKnowledgeSyncDebug') === '1';
            } catch (_) {
                return window.__NEXORA_PUBLIC_KNOWLEDGE_SYNC_DEBUG === true;
            }
        }

        function logPublicKnowledgeSync(message, details = {}) {
            if (!isPublicKnowledgeSyncDebugEnabled()) {
                return;
            }

            console.debug('[PublicKnowledgeSync]', message, details);
        }

        function warnPublicKnowledgeSync(message, details = {}) {
            console.warn('[PublicKnowledgeSync]', message, details);
        }

        function schedulePublicKnowledgeSave(delay = PUBLIC_KNOWLEDGE_AUTOSAVE_MS) {
            if (saveTimer) {
                clearTimeout(saveTimer);
            }

            saveTimer = setTimeout(() => saveData(false), Math.max(0, Number(delay || 0)));
        }

        async function uploadImageForEditor(file, onSuccess, onError) {
            try {
                const picked = file;
                const mime = String((picked && picked.type) || '').toLowerCase();
                if (!mime.startsWith('image/')) throw new Error('仅支持图片文件');
                const size = Number((picked && picked.size) || 0);
                if (size > 12 * 1024 * 1024) throw new Error('图片过大，请控制在 12MB 以内');
                const fileName = normalizeKnowledgeImageFileName(picked, `share-image-${Date.now()}`);
                setSaveStatus('saving', `图片上传中：${fileName}`);
                const allocated = await allocatePublicKnowledgeImageSlot(fileName);
                const imageId = String(allocated.image_id || '').trim().toLowerCase();
                if (!imageId) throw new Error('图片分配失败：image_id 为空');
                const uploaded = await uploadPublicKnowledgeImageByFile({ imageId, file: picked, fileName });
                const finalUrl = String(uploaded.image_url || '').trim();
                if (!finalUrl) throw new Error('上传成功但返回地址为空');
                onSuccess(finalUrl);
                setSaveStatus('saving', `图片已上传：${fileName}`);
            } catch (err) {
                const message = String((err && err.message) || err || '图片上传失败');
                onError(message);
                setSaveStatus('error', message);
            }
        }

        // ── 行级三方合并 ──
        // base: 上次同步的服务端内容, local: 当前编辑器内容, remote: 新拉取的服务端内容
        function mergeContent(base, local, remote) {
            if (remote === local) return remote;
            if (local === remote) return remote;
            if (local === base) return remote;
            if (!base || base === remote) return local;

            const baseLines = base.split('\n');
            const localLines = local.split('\n');
            const remoteLines = remote.split('\n');

            // 简单场景：行数相同，逐行比对合并
            const maxLen = Math.max(baseLines.length, localLines.length, remoteLines.length);
            const merged = [];
            let hasConflict = false;

            for (let i = 0; i < maxLen; i++) {
                const b = i < baseLines.length ? baseLines[i] : undefined;
                const l = i < localLines.length ? localLines[i] : undefined;
                const r = i < remoteLines.length ? remoteLines[i] : undefined;

                const localChanged = (l !== b);
                const remoteChanged = (r !== b);

                if (!localChanged && !remoteChanged) {
                    // 都没改：取 base（或 remote，相同）
                    merged.push(b !== undefined ? r : '');
                } else if (remoteChanged && !localChanged) {
                    // 只有远端改了：取远端
                    merged.push(r !== undefined ? r : '');
                } else if (localChanged && !remoteChanged) {
                    // 只有本地改了：取本地
                    merged.push(l !== undefined ? l : '');
                } else {
                    // 都改了：本地优先
                    hasConflict = true;
                    merged.push(l !== undefined ? l : '');
                }
            }

            return merged.join('\n');
        }

        function updateContentVersion(payload, syncedValue = null) {
            const data = payload && typeof payload === 'object' ? payload : {};
            lastContentRevision = String(data.content_revision || data.contentRevision || lastContentRevision || '').trim();
            lastContentHash = String(data.content_hash || data.contentHash || lastContentHash || '').trim();
            lastUpdatedAt = Number(data.updated_at || data.updatedAt || lastUpdatedAt || 0);

            if (syncedValue !== null) {
                lastSyncedValue = String(syncedValue || '');
            }
        }

        function capturePublicEditorViewportSnapshot() {
            const selectors = [
                '#editor .toastui-editor-md-container',
                '#editor .toastui-editor-md-preview',
                '#editor .toastui-editor-ww-container',
                '#editor .ProseMirror',
                '#editor .toastui-editor-contents',
                '#editor .toastui-editor-defaultUI',
                '#editor'
            ];
            const nodes = selectors
                .map((selector) => {
                    const node = document.querySelector(selector);

                    if (!node) return null;

                    return {
                        selector,
                        top: Math.max(0, Number(node.scrollTop || 0)),
                        left: Math.max(0, Number(node.scrollLeft || 0))
                    };
                })
                .filter(Boolean);

            return {
                cursor: getEditorLineCol(),
                nodes,
                windowX: Number(window.scrollX || 0),
                windowY: Number(window.scrollY || window.pageYOffset || 0)
            };
        }

        function restorePublicEditorViewportSnapshot(snapshot) {
            const data = snapshot && typeof snapshot === 'object' ? snapshot : null;

            if (!data) return;

            const apply = () => {
                if (data.cursor) restoreEditorLineCol(data.cursor);

                (Array.isArray(data.nodes) ? data.nodes : []).forEach((item) => {
                    const node = document.querySelector(item.selector);

                    if (!node) return;

                    node.scrollTop = Math.max(0, Number(item.top || 0));
                    node.scrollLeft = Math.max(0, Number(item.left || 0));
                });

                window.scrollTo(Number(data.windowX || 0), Number(data.windowY || 0));
            };

            [0, 80, 240].forEach((delay) => {
                setTimeout(() => requestAnimationFrame(apply), delay);
            });
        }

        function applyRemoteKnowledgePayload(payload, statusText = '已同步（远端更新）') {
            const server = payload && payload.server && typeof payload.server === 'object' ? payload.server : payload;
            const remote = String((server && server.content) || '');

            if (!toastEditor) return false;

            const local = toastEditor.getMarkdown();
            const base = lastSyncedValue;

            if (remote === local) {
                updateContentVersion(server, remote);
                lastValue = remote;
                logPublicKnowledgeSync('remote payload already equals local editor', {
                    revision: server && (server.content_revision || server.contentRevision) || '',
                    hash: server && server.content_hash ? String(server.content_hash).slice(0, 12) : '',
                    length: remote.length
                });
                return true;
            }

            const merged = mergeContent(base, local, remote);
            const remoteChangedAgainstBase = remote !== String(base || '');

            if (merged === local) {
                updateContentVersion(server, remote);
                lastValue = remote;
                logPublicKnowledgeSync('remote payload kept local editor content', {
                    remoteChangedAgainstBase,
                    localLength: local.length,
                    remoteLength: remote.length,
                    revision: server && (server.content_revision || server.contentRevision) || ''
                });

                if (remoteChangedAgainstBase) {
                    setSaveStatus('ok', statusText);
                    schedulePublicKnowledgeSave(PUBLIC_KNOWLEDGE_REMOTE_MERGE_SAVE_MS);
                }

                return true;
            }

            const viewportSnapshot = capturePublicEditorViewportSnapshot();
            applyingRemoteUpdate = true;

            if (saveTimer) {
                clearTimeout(saveTimer);
                saveTimer = null;
            }

            try {
                toastEditor.setMarkdown(merged);
                updateContentVersion(server, remote);
                lastValue = remote;
                restorePublicEditorViewportSnapshot(viewportSnapshot);
                logPublicKnowledgeSync('remote payload rewrote editor content', {
                    localLength: local.length,
                    remoteLength: remote.length,
                    mergedLength: merged.length,
                    revision: server && (server.content_revision || server.contentRevision) || ''
                });

                if (merged !== remote) {
                    schedulePublicKnowledgeSave(PUBLIC_KNOWLEDGE_REMOTE_MERGE_SAVE_MS);
                }
            } finally {
                setTimeout(() => {
                    applyingRemoteUpdate = false;
                }, 240);
            }

            setSaveStatus('ok', statusText);
            return true;
        }

        function queueRemoteKnowledgePayload(payload, statusText) {
            pendingRemoteKnowledgePayload = {
                mode: Object.prototype.hasOwnProperty.call(payload || {}, 'content') ? 'apply' : 'refresh',
                payload: payload && typeof payload === 'object' ? payload : {},
                statusText: String(statusText || '已同步（远端更新）')
            };
        }

        function flushPendingRemoteKnowledgePayload() {
            const pending = pendingRemoteKnowledgePayload;

            pendingRemoteKnowledgePayload = null;

            if (!pending || !pending.payload) return false;

            if (pending.mode === 'refresh') {
                void refreshRemoteKnowledgeFromHttp(pending.statusText);
                return true;
            }

            return applyRemoteKnowledgePayload(pending.payload, pending.statusText);
        }

        function getPublicKnowledgeWsUrl() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            return `${protocol}//${window.location.host}/ws/public/knowledge/${encodeURIComponent(OWNER_USERNAME)}/${encodeURIComponent(SHARE_ID)}`;
        }

        function sendPublicKnowledgeWsMessage(message) {
            if (!publicKnowledgeSocket || publicKnowledgeSocket.readyState !== WebSocket.OPEN) return false;

            publicKnowledgeSocket.send(JSON.stringify(message && typeof message === 'object' ? message : {}));
            return true;
        }

        async function refreshRemoteKnowledgeFromHttp(statusText = '已同步（远端更新）') {
            if (!toastEditor || savingNow) return false;

            try {
                const res = await fetch(`/api/public/knowledge/${encodeURIComponent(OWNER_USERNAME)}/${encodeURIComponent(SHARE_ID)}`);
                const data = await res.json().catch(() => ({}));

                if (!res.ok || !data || !data.success) return false;

                return applyRemoteKnowledgePayload(data, statusText);
            } catch (_) {
                return false;
            }
        }

        function handlePublicKnowledgeSocketMessage(payload) {
            const msgType = String(payload && payload.type ? payload.type : '').trim();

            if (msgType === 'public_knowledge_ready') {
                setSaveStatus('ok', '实时同步已连接');
                sendPublicKnowledgeWsMessage({ type: 'sync_knowledge' });
                return;
            }

            if (msgType === 'knowledge_state' || msgType === 'knowledge_changed') {
                const remoteRevision = String((payload && payload.content_revision) || '').trim();
                const remoteHash = String((payload && payload.content_hash) || '').trim();
                const hasPayloadContent = Object.prototype.hasOwnProperty.call(payload, 'content');

                logPublicKnowledgeSync('received websocket payload', {
                    type: msgType,
                    remoteRevision,
                    localRevision: lastContentRevision,
                    remoteHash: remoteHash ? remoteHash.slice(0, 12) : '',
                    localHash: lastContentHash ? lastContentHash.slice(0, 12) : '',
                    hasPayloadContent,
                    savingNow,
                    pendingRemote: !!pendingRemoteKnowledgePayload
                });

                if (
                    remoteRevision
                    && remoteRevision === lastContentRevision
                    && (!remoteHash || remoteHash === lastContentHash)
                ) {
                    return;
                }

                const statusText = msgType === 'knowledge_state' ? '已校验最新版本' : '已同步（远端更新）';

                if (savingNow) {
                    queueRemoteKnowledgePayload(payload, statusText);
                    return;
                }

                if (hasPayloadContent) {
                    applyRemoteKnowledgePayload(payload, statusText);
                    return;
                }

                void refreshRemoteKnowledgeFromHttp(statusText);
                return;
            }

            if (msgType === 'public_knowledge_closed') {
                publicKnowledgeSocketClosedByServer = true;
                clearPublicKnowledgeSocketTimers();
                if (publicKnowledgeSocket) {
                    publicKnowledgeSocket.close();
                    publicKnowledgeSocket = null;
                }
                setSaveStatus('error', String((payload && payload.message) || '协作链接已关闭'));
            }
        }

        function clearPublicKnowledgeSocketTimers() {
            if (publicKnowledgeReconnectTimer) {
                clearTimeout(publicKnowledgeReconnectTimer);
                publicKnowledgeReconnectTimer = null;
            }

            if (publicKnowledgePingTimer) {
                clearInterval(publicKnowledgePingTimer);
                publicKnowledgePingTimer = null;
            }
        }

        function schedulePublicKnowledgeReconnect() {
            if (publicKnowledgeSocketClosedByServer) return;
            if (publicKnowledgeReconnectTimer) return;

            publicKnowledgeReconnectTimer = setTimeout(() => {
                publicKnowledgeReconnectTimer = null;
                startPublicKnowledgeSocket();
            }, PUBLIC_KNOWLEDGE_RECONNECT_MS);
        }

        function startPublicKnowledgePing() {
            if (publicKnowledgePingTimer) clearInterval(publicKnowledgePingTimer);

            publicKnowledgePingTimer = setInterval(() => {
                sendPublicKnowledgeWsMessage({
                    type: 'ping',
                    ts: Date.now()
                });
            }, PUBLIC_KNOWLEDGE_PING_MS);
        }

        function startPublicKnowledgeSocket() {
            if (publicKnowledgeSocketClosedByServer) return;
            if (publicKnowledgeSocket && publicKnowledgeSocket.readyState === WebSocket.OPEN) return;

            clearPublicKnowledgeSocketTimers();

            try {
                publicKnowledgeSocket = new WebSocket(getPublicKnowledgeWsUrl());
            } catch (e) {
                setSaveStatus('error', '实时同步通道启动失败');
                schedulePublicKnowledgeReconnect();
                return;
            }

            publicKnowledgeSocket.addEventListener('open', () => {
                setSaveStatus('ok', '实时同步连接中');
                startPublicKnowledgePing();
            });

            publicKnowledgeSocket.addEventListener('message', (event) => {
                try {
                    handlePublicKnowledgeSocketMessage(JSON.parse(event.data || '{}'));
                } catch (_) {}
            });

            publicKnowledgeSocket.addEventListener('close', () => {
                publicKnowledgeSocket = null;
                clearPublicKnowledgeSocketTimers();
                if (publicKnowledgeSocketClosedByServer) return;
                setSaveStatus('error', '实时同步断开，正在重连');
                schedulePublicKnowledgeReconnect();
            });

            publicKnowledgeSocket.addEventListener('error', () => {
                setSaveStatus('error', '实时同步通道异常');
            });
        }

        // ── 光标位置辅助 ──
        function getEditorLineCol() {
            try {
                if (!toastEditor) return null;
                const md = toastEditor.getMarkdown();
                let offset = null;
                // 优先 ToastUI getSelection
                if (typeof toastEditor.getSelection === 'function') {
                    const sel = toastEditor.getSelection();
                    if (Array.isArray(sel) && typeof sel[0] === 'number') offset = sel[0];
                }
                // fallback: ProseMirror view
                if (offset == null) {
                    const view = toastEditor.mdEditor && toastEditor.mdEditor.view;
                    if (view && view.state) offset = view.state.selection.from;
                }
                if (offset == null) return null;
                const before = md.slice(0, offset);
                const lines = before.split('\n');
                return { line: lines.length - 1, col: (lines[lines.length - 1] || '').length };
            } catch (_) { return null; }
        }

        function restoreEditorLineCol(lc) {
            try {
                if (!toastEditor || !lc) return;
                const md = toastEditor.getMarkdown();
                const allLines = md.split('\n');
                const line = Math.min(Math.max(0, lc.line), allLines.length - 1);
                let offset = 0;
                for (let i = 0; i < line; i++) offset += allLines[i].length + 1;
                offset += Math.min(lc.col, (allLines[line] || '').length);

                // ProseMirror view（ToastUI markdown 模式的底层编辑器）
                const view = toastEditor.mdEditor && toastEditor.mdEditor.view;
                if (view && view.state) {
                    const docSize = view.state.doc.content.size;
                    const pos = Math.min(Math.max(1, offset + 1), docSize);
                    try {
                        const $pos = view.state.doc.resolve(pos);
                        const sel = view.state.selection.constructor.near($pos);
                        view.dispatch(view.state.tr.setSelection(sel));
                        view.focus();
                        return;
                    } catch (_) {}
                }
                // fallback: ToastUI API
                if (typeof toastEditor.setSelection === 'function') {
                    toastEditor.setSelection(offset, offset);
                }
            } catch (_) {}
        }

        async function saveData(force = false) {
            if (!toastEditor) return;

            if (savingNow) {
                queuedSaveAfterCurrent = true;
                queuedForceSaveAfterCurrent = queuedForceSaveAfterCurrent || !!force;
                logPublicKnowledgeSync('public save queued during in-flight save', {
                    force: !!force
                });
                return;
            }

            const val = toastEditor.getMarkdown();
            if (!force && val === lastValue) return;
            savingNow = true;
            setSaveStatus('saving', '同步中...');
            try {
                logPublicKnowledgeSync('saving public knowledge', {
                    force,
                    baseRevision: lastContentRevision,
                    baseHash: lastContentHash ? lastContentHash.slice(0, 12) : '',
                    contentLength: val.length
                });

                const res = await fetch(`/api/public/knowledge/${encodeURIComponent(OWNER_USERNAME)}/${encodeURIComponent(SHARE_ID)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        content: val,
                        base_content_revision: lastContentRevision,
                        base_content_hash: lastContentHash
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (res.ok && data && data.success) {
                    lastValue = val;
                    updateContentVersion(data, val);
                    setSaveStatus('ok', '已同步');
                    logPublicKnowledgeSync('public save accepted', {
                        revision: data.content_revision || data.contentRevision || '',
                        hash: data.content_hash ? String(data.content_hash).slice(0, 12) : ''
                    });
                } else if (data && data.code === 'knowledge_content_conflict') {
                    warnPublicKnowledgeSync('public save conflict', {
                        baseRevision: lastContentRevision,
                        serverRevision: data.server && (data.server.content_revision || data.server.contentRevision) || '',
                        serverHash: data.server && data.server.content_hash ? String(data.server.content_hash).slice(0, 12) : ''
                    });

                    if (!applyRemoteKnowledgePayload(data, '远端更新已合并，请检查后保存')) {
                        setSaveStatus('error', String(data.message || '远端内容已更新，请刷新后重试'));
                    }
                } else {
                    setSaveStatus('error', `同步失败: ${String((data && data.message) || '未知错误')}`);
                }
            } catch (e) {
                setSaveStatus('error', `离线: ${String((e && e.message) || e || '网络错误')}`);
            } finally {
                savingNow = false;
                flushPendingRemoteKnowledgePayload();

                if (queuedSaveAfterCurrent) {
                    const queuedForce = queuedForceSaveAfterCurrent;
                    queuedSaveAfterCurrent = false;
                    queuedForceSaveAfterCurrent = false;
                    void saveData(queuedForce);
                }
            }
        }

        function initEditor() {
            try {
                // 初始化阶段附加模式类以匹配 currentMode (默认 split)
                document.querySelector('.public-edit-host').classList.add('mode-split');

                const Editor = window.toastui.Editor;
                const initialContent = document.getElementById('editorContent').value;
                toastEditor = new Editor({
                    el: document.getElementById('editor'),
                    initialEditType: 'markdown',
                    previewStyle: 'vertical',
                    height: '100%',
                    initialValue: initialContent,
                    hideModeSwitch: true,
                    toolbarItems: [], // 隐藏自带工具栏，使用上方自定义的 Nexora 风格
                    hooks: {
                        addImageBlobHook: async (blob, callback) => {
                            await uploadImageForEditor(blob, 
                                (url) => callback(url, blob.name || 'image'),
                                (err) => console.error(err)
                            );
                        }
                    },
                    customHTMLRenderer: {
                        htmlBlock: {
                            iframe(node) {
                                return [
                                    { type: 'openTag', tagName: 'iframe', outerNewLine: true, attributes: node.attrs },
                                    { type: 'html', content: node.childrenHTML },
                                    { type: 'closeTag', tagName: 'iframe', outerNewLine: true }
                                ];
                            }
                        }
                    }
                });
                
                // 将 Toast UI 原生预览区域加上 Nexora 统一排版样式类
                const previewEl = document.querySelector('#editor .toastui-editor-contents');
                if (previewEl) {
                    previewEl.classList.add('content-body');
                    previewEl.classList.add('editor-preview');
                }

                // 绑定自定义工具栏事件
                const tb = document.getElementById('customToolbar');
                if (tb) {
                    tb.addEventListener('click', (e) => {
                        const btn = e.target.closest('[data-cmd], [data-action]');
                        if (!btn) return;
                        const cmd = btn.getAttribute('data-cmd');
                        const action = btn.getAttribute('data-action');
                        
                        if (cmd) {
                            if (cmd === 'image') {
                                document.getElementById('imageFileInput').click();
                                return;
                            }
                            const mapping = {
                                'bold': 'bold', 'italic': 'italic', 'strike': 'strike',
                                'heading': 'heading', 'quote': 'blockQuote',
                                'ul': 'bulletList', 'ol': 'orderedList',
                                'link': 'addLink', 'table': 'addTable'
                            };
                            if (mapping[cmd]) {
                                toastEditor.exec(mapping[cmd]);
                            }
                        } else if (action) {
                            try {
                                const host = document.querySelector('.public-edit-host');
                                const shell = document.querySelector('.public-edit-shell');
                                
                                if (action === 'fullscreen') {
                                    // 模拟 EasyMDE 全屏 (CSS Fixed 罩层)，不使用受限的 HTML5 Fullscreen
                                    shell.classList.toggle('is-fullscreen');
                                    const isFS = shell.classList.contains('is-fullscreen');
                                    btn.classList.toggle('active', isFS);
                                    btn.innerHTML = isFS ? '<i class="fa fa-compress"></i>' : '<i class="fa fa-arrows-alt"></i>';
                                    if (toastEditor) setTimeout(() => toastEditor.focus(), 50);
                                    return;
                                }

                                if (action === 'preview') {
                                    // EasyMDE 原版逻辑: 切换 纯预览 与 纯编辑
                                    currentMode = (currentMode === 'preview') ? 'edit' : 'preview';
                                } else if (action === 'split') {
                                    // EasyMDE 原版逻辑: 切换 分屏 与 纯编辑
                                    currentMode = (currentMode === 'split') ? 'edit' : 'split';
                                }

                                // 强制使得底层保持 vertical/markdown 渲染布局，靠上层 CSS 的 display 来控制视窗
                                toastEditor.changeMode('markdown');
                                toastEditor.changePreviewStyle('vertical');

                                // 更新 CSS 状态机来决定哪个面板显示
                                host.classList.remove('mode-edit', 'mode-preview', 'mode-split');
                                host.classList.add('mode-' + currentMode);

                                tb.querySelector('.preview').classList.toggle('active', currentMode === 'preview');
                                tb.querySelector('.side-by-side').classList.toggle('active', currentMode === 'split');
                            } catch (_) {}
                        }
                    });
                }

                // 图片文件选择器
                const imageInput = document.getElementById('imageFileInput');
                if (imageInput) {
                    imageInput.addEventListener('change', async () => {
                        const file = imageInput.files && imageInput.files[0];
                        imageInput.value = '';
                        if (!file || !toastEditor) return;
                        await uploadImageForEditor(file,
                            (url) => {
                                const alt = file.name || 'image';
                                const imgMd = `![${alt}](${url})`;
                                if (typeof toastEditor.insertText === 'function') {
                                    toastEditor.insertText(imgMd);
                                } else {
                                    const md = toastEditor.getMarkdown();
                                    toastEditor.setMarkdown(md + '\n' + imgMd);
                                }
                            },
                            (err) => { /* error already shown in status */ }
                        );
                    });
                }

                // 覆盖默认的 Markdown 渲染以确保安全和统一
                if (window.NexoraSecureRender) {
                    toastEditor.setMarkdown = (function(original) {
                        return function(md) {
                            return original.call(this, md);
                        };
                    })(toastEditor.setMarkdown);
                }
            } catch (err) {
                setSaveStatus('error', `编辑器初始化失败: ${String((err && err.message) || err || 'unknown')}`);
                return;
            }
            lastValue = toastEditor.getMarkdown();
            lastSyncedValue = lastValue;
            toastEditor.on('change', () => {
                if (applyingRemoteUpdate) return;

                schedulePublicKnowledgeSave();
            });
        }

        document.addEventListener('keydown', async (e) => {
            const key = String(e.key || '').toLowerCase();
            if ((e.ctrlKey || e.metaKey) && key === 's') {
                e.preventDefault();
                e.stopPropagation();
                await saveData(true);
            }
        }, true);

        initEditor();
        startPublicKnowledgeSocket();
    </script>
</body>
</html>
