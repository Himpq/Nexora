<html>
<head>
    <title>WNetdisk - 管理面板</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="./css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./faw/css/font-awesome.min.css">
    <script src="./js/wajax.js"></script>
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .navbar { margin-bottom: 20px;     border-radius: 9px;}
        .main-container {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);

            overflow-y: scroll;
        }
        .file-list {
            height: calc(100vh - 250px);
            overflow-y: auto;
        }
        .file-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .file-item:hover { background-color: #f8f9fa; }
        .file-icon { margin-right: 10px; }
        .breadcrumb {
            background-color: #f8f9fa;
            padding: 8px 16px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .role-badge {
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }
        .role-normal { background: #e9ecef; color: #495057; }
        .role-vip { background: #fff3cd; color: #856404; }
        .role-admin { background: #2b9516; color: #ffffff; }
        .action-buttons {
            display: flex;
            gap: 5px;
            min-width: 380px;
        }
        .action-buttons .btn {
            flex: 1;
            white-space: nowrap;
            padding: 0.25rem 0.5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="fa fa-shield"></i> WNetdisk 管理面板</a>
            <div class="navbar-nav ms-auto">
                <a href="./index.html" class="btn btn-light">
                    <i class="fa fa-cloud"></i> 返回网盘
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            <div class="col-md-3">
                <div class="main-container">
                    <h5>用户管理</h5>
                    <div class="list-group">
                        <a href="#" class="list-group-item list-group-item-action" onclick="showUserList()">
                            <i class="fa fa-users"></i> 用户列表
                        </a>
                        <a href="#" class="list-group-item list-group-item-action" onclick="showCreateUser()">
                            <i class="fa fa-user-plus"></i> 创建用户
                        </a>
                    </div>
                </div>
            </div>

            <div class="col-md-9">
                <div class="main-container" id="mainContent"></div>
            </div>
        </div>
    </div>

    <script>
        let currentPath = './';
        let currentUser = '';

        function showUserList() {
            newCallback(function(response, xhr) {
                if (xhr.status !== 200 || xhr.readyState !== 4) {
                    return;
                }
                const data = JSON.parse(response);
                let html = `
                    <h4>用户列表</h4>
                    <table class="table">
                        <thead>
                            <tr>
                                <th>用户名</th>
                                <th>权限</th>
                                <th style="min-width:300px">操作</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                
                for(let username in data) {
                    const role = data[username].role || 'normal';
                    const roleClass = `role-${role}`;
                    html += `
                        <tr>
                            <td>${username}</td>
                            <td><span class="role-badge ${roleClass}">${role}</span></td>
                            <td>
                                <div class="action-buttons">
                                    <button class="btn btn-sm btn-primary" onclick="viewUserFiles('${username}')">
                                        <i class="fa fa-folder-open"></i> 查看文件
                                    </button>
                                    <button class="btn btn-sm btn-warning" onclick="showChangePassword('${username}')">
                                        <i class="fa fa-key"></i> 修改密码
                                    </button>
                                    <button class="btn btn-sm btn-info" onclick="showChangeRole('${username}', '${role}')">
                                        <i class="fa fa-user-circle"></i> 修改权限
                                    </button>
                                    <button class="btn btn-sm btn-danger" onclick="confirmDeleteUser('${username}')">
                                        <i class="fa fa-trash"></i> 删除用户
                                    </button>
                                </div>
                            </td>
                        </tr>
                    `;
                }
                
                html += `</tbody></table>`;
                document.getElementById('mainContent').innerHTML = html;
            }, './api/manageuser.py?type=alluser');
        }

        function showCreateUser() {
            let html = `
                <h4>创建新用户</h4>
                <div class="mb-3">
                    <label class="form-label">用户名</label>
                    <input type="text" class="form-control" id="newUsername">
                </div>
                <div class="mb-3">
                    <label class="form-label">密码</label>
                    <input type="password" class="form-control" id="newPassword">
                </div>
                <button class="btn btn-primary" onclick="createUser()">
                    <i class="fa fa-plus"></i> 创建用户
                </button>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function confirmDeleteUser(username) {
            if(confirm(`确定要删除用户 "${username}" 吗？此操作不可恢复！`)) {
                deleteUser(username);
            }
        }

        function deleteUser(username) {
            newCallback(function(response, xhr) {
                if (xhr.readyState !== 4 || xhr.status !== 200) {
                    return;
                }
                alert(response);
                showUserList();
            }, './api/manageuser.py', null, 'POST', true, JSON.stringify({type: 'deleteuser', user: username}));
        }

        function createUser() {
            const username = document.getElementById('newUsername').value;
            const password = document.getElementById('newPassword').value;
            
            if(!username || !password) {
                alert('用户名和密码不能为空');
                return;
            }
            
            newCallback(function(response, xhr) {
                if (xhr.readyState !== 4 || xhr.status !== 200) {
                    return;
                }
                alert(response);
                showUserList();
            }, './api/manageuser.py', null, 'POST', true, JSON.stringify({type: 'create', user: username, pwd: password}));
        }

        function showChangePassword(username) {
            let html = `
                <h4>修改密码 - ${username}</h4>
                <div class="mb-3">
                    <label class="form-label">新密码</label>
                    <input type="password" class="form-control" id="newPwd">
                </div>
                <button class="btn btn-primary" onclick="changePassword('${username}')">
                    <i class="fa fa-save"></i> 保存修改
                </button>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function changePassword(username) {
            const newPassword = document.getElementById('newPwd').value;
            if(!newPassword) {
                alert('密码不能为空');
                return;
            }
            
            newCallback(function(response, xhr) {
                if (!xhr.readyState == 4 || xhr.status !== 200) {
                    return;
                }
                alert(response);
                showUserList();
            }, './api/manageuser.py', null, 'POST', true, JSON.stringify({type: 'changepwd', user: username, pwd: newPassword}));
        }

        function showChangeRole(username, currentRole) {
            let html = `
                <h4>修改用户权限 - ${username}</h4>
                <div class="mb-3">
                    <label class="form-label">权限级别</label>
                    <select class="form-select" id="newRole">
                        <option value="normal" ${currentRole === 'normal' ? 'selected' : ''}>普通用户</option>
                        <option value="vip" ${currentRole === 'vip' ? 'selected' : ''}>VIP用户</option>
                        <option value="admin" ${currentRole === 'admin' ? 'selected' : ''}>管理员</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="changeRole('${username}')">
                    <i class="fa fa-save"></i> 保存修改
                </button>
            `;
            document.getElementById('mainContent').innerHTML = html;
        }

        function changeRole(username) {
            const newRole = document.getElementById('newRole').value;
            newCallback(function(response, xhr) {
                if (xhr.readyState !== 4 || xhr.status !== 200) {
                    return;
                }
                alert(response);
                showUserList();
            }, './api/manageuser.py', null, 'POST', true, JSON.stringify({user: username, role: newRole}));
        }

        function viewUserFiles(username, path = './') {
            currentUser = username;
            currentPath = path;

            const query = new URLSearchParams({ user: username, dir: path });

            newCallback(function(response, xhr) {
                if (xhr.status !== 200 || xhr.readyState !== 4) {
                    return;
                }

                const data = JSON.parse(response);

                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = '';

                const heading = document.createElement('h4');
                heading.textContent = username + '的文件';
                mainContent.appendChild(heading);

                const uploadButton = document.createElement('button');
                uploadButton.type = 'button';
                uploadButton.className = 'btn btn-success mb-3';
                uploadButton.addEventListener('click', function() {
                    showUploadDialog(username, path);
                });

                const uploadIcon = document.createElement('i');
                uploadIcon.className = 'fa fa-upload';
                uploadButton.appendChild(uploadIcon);
                uploadButton.appendChild(document.createTextNode(' 上传文件'));
                mainContent.appendChild(uploadButton);

                const navigation = document.createElement('nav');
                navigation.setAttribute('aria-label', 'breadcrumb');

                const breadcrumb = document.createElement('ol');
                breadcrumb.className = 'breadcrumb';

                const rootItem = document.createElement('li');
                rootItem.className = 'breadcrumb-item';

                const rootLink = document.createElement('a');
                rootLink.href = '#';
                rootLink.textContent = '根目录';
                rootLink.addEventListener('click', function(event) {
                    event.preventDefault();
                    viewUserFiles(username);
                });

                rootItem.appendChild(rootLink);
                breadcrumb.appendChild(rootItem);

                if (path !== './') {
                    const pathParts = path.split('/').filter(function(part) {
                        return part;
                    });
                    let breadcrumbPath = './';

                    pathParts.forEach(function(part, index) {
                        if (part === '.') {
                            return;
                        }

                        breadcrumbPath += part + '/';
                        const targetPath = breadcrumbPath;

                        const item = document.createElement('li');
                        item.className = 'breadcrumb-item';

                        if (index === pathParts.length - 1) {
                            item.textContent = part;
                        } else {
                            const link = document.createElement('a');
                            link.href = '#';
                            link.textContent = part;
                            link.addEventListener('click', function(event) {
                                event.preventDefault();
                                viewUserFiles(username, targetPath);
                            });
                            item.appendChild(link);
                        }

                        breadcrumb.appendChild(item);
                    });
                }

                navigation.appendChild(breadcrumb);
                mainContent.appendChild(navigation);

                const fileList = document.createElement('div');
                fileList.className = 'file-list';

                if (path !== './') {
                    const backItem = document.createElement('div');
                    backItem.className = 'file-item';
                    backItem.addEventListener('click', handleBackClick);

                    const backIcon = document.createElement('i');
                    backIcon.className = 'fa fa-arrow-up file-icon';
                    backItem.appendChild(backIcon);
                    backItem.appendChild(document.createTextNode(' 返回上级目录'));
                    fileList.appendChild(backItem);
                }

                Object.keys(data).forEach(function(key) {
                    const item = data[key];
                    const icon = item.type ? 'fa-file' : 'fa-folder';

                    const fileItem = document.createElement('div');
                    fileItem.className = 'file-item';
                    fileItem.addEventListener('click', function() {
                        handleFileClick(item.name, item.type);
                    });

                    const fileIcon = document.createElement('i');
                    fileIcon.className = 'fa ' + icon + ' file-icon';
                    fileItem.appendChild(fileIcon);
                    fileItem.appendChild(document.createTextNode(' ' + item.name));

                    if (item.type) {
                        const downloadParams = new URLSearchParams({
                            user: username,
                            filepath: path + item.name
                        });
                        const downloadLink = document.createElement('a');
                        downloadLink.href = './api/download.py?' + downloadParams.toString();
                        downloadLink.className = 'btn btn-sm btn-primary ms-2';

                        const downloadIcon = document.createElement('i');
                        downloadIcon.className = 'fa fa-download';
                        downloadLink.appendChild(downloadIcon);
                        downloadLink.appendChild(document.createTextNode(' 下载'));
                        fileItem.appendChild(downloadLink);
                    }

                    fileList.appendChild(fileItem);
                });

                mainContent.appendChild(fileList);
            }, './api/getlistdir.py?' + query.toString());
        }

        function showUploadDialog(username, path) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '';

            const modalContent = document.createElement('div');
            modalContent.className = 'modal-content p-4';

            const heading = document.createElement('h4');
            heading.textContent = '上传文件到 ' + username + ' 的目录';
            modalContent.appendChild(heading);

            const fileInputGroup = document.createElement('div');
            fileInputGroup.className = 'mb-3';

            const fileLabel = document.createElement('label');
            fileLabel.className = 'form-label';
            fileLabel.textContent = '选择文件';
            fileInputGroup.appendChild(fileLabel);

            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.className = 'form-control';
            fileInput.id = 'fileInput';
            fileInputGroup.appendChild(fileInput);
            modalContent.appendChild(fileInputGroup);

            const progress = document.createElement('div');
            progress.className = 'progress mb-3';
            progress.style.display = 'none';

            const progressBar = document.createElement('div');
            progressBar.className = 'progress-bar';
            progressBar.setAttribute('role', 'progressbar');
            progressBar.style.width = '0%';
            progress.appendChild(progressBar);
            modalContent.appendChild(progress);

            const uploadButton = document.createElement('button');
            uploadButton.type = 'button';
            uploadButton.className = 'btn btn-primary';
            uploadButton.addEventListener('click', function() {
                uploadFile(username, path);
            });

            const uploadIcon = document.createElement('i');
            uploadIcon.className = 'fa fa-upload';
            uploadButton.appendChild(uploadIcon);
            uploadButton.appendChild(document.createTextNode(' 开始上传'));
            modalContent.appendChild(uploadButton);

            mainContent.appendChild(modalContent);
        }

        function uploadFile(username, path) {
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) {
                alert('请选择文件');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            const xhr = new XMLHttpRequest();
            const progressBar = document.querySelector('.progress');
            const progressBarInner = document.querySelector('.progress-bar');
            
            progressBar.style.display = 'block';
            
            xhr.upload.addEventListener('progress', (e) => {
                if (e.lengthComputable) {
                    const percent = (e.loaded / e.total) * 100;
                    progressBarInner.style.width = percent + '%';
                    progressBarInner.textContent = Math.round(percent) + '%';
                }
            });

            xhr.onreadystatechange = function() {
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        alert('上传成功');
                        viewUserFiles(username, path);
                    } else {
                        alert('上传失败: ' + xhr.responseText);
                    }
                }
            };

            xhr.open('POST', `./api/updatefile.py?username=${username}&path=${path}`, true);
            xhr.send(formData);
        }

        function handleFileClick(filename, isFile) {
            if(!isFile) {
                const newPath = currentPath + filename + '/';
                viewUserFiles(currentUser, newPath);
            }
        }

        function handleBackClick() {
            const pathParts = currentPath.split('/').filter(p => p);
            pathParts.pop();
            const newPath = pathParts.length ? './' + pathParts.join('/') + '/' : './';
            viewUserFiles(currentUser, newPath);
        }

        window.onload = showUserList;
    </script>
</body>
</html>
